<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top">
    <div class="brand">Piper</div>
    <span id="conn" class="pill">Connecting</span>
    <span id="cwd" class="dim"></span>
    <span id="sliceName" class="slice-name">Idle</span>
    <span id="status" class="pill">idle</span>
    <span id="elapsed" class="mono">0:00</span>
    <span id="turn" class="mono">turn 0</span>
  </header>
  <div id="layout">
    <aside id="rail" aria-label="Slices"></aside>
    <main id="log">
      <section id="brief" hidden></section>
      <section id="feed"></section>
      <section id="review" hidden></section>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
