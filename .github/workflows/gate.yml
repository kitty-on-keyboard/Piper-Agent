name: gate

# S15.2: `ctest -L gate` green is required to merge. Nothing lands red.
# S15.9: CI never commits. There is no write permission below, and no step that pushes.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    # Apple Silicon only (S1). Unified memory is assumed, not abstracted over -- an
    # x86 runner would be testing a configuration that cannot ship.
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: The log corpus survived the clone
        # S18: `.gitignore`'s `*.log` will silently swallow a committed log corpus. The
        # negation is in .gitignore and test_corpus_loads asserts the bytes, but this
        # runs before the build so a swallowed corpus fails in seconds with an obvious
        # message rather than as a puzzling assertion 90 seconds later.
        run: |
          logs=$(ls bakeoff/log_triage/logs/*.log | wc -l | tr -d ' ')
          holdout=$(ls bakeoff/log_triage/holdout_logs/*.log | wc -l | tr -d ' ')
          bytes=$(cat bakeoff/log_triage/logs/*.log | wc -c | tr -d ' ')
          echo "logs=$logs holdout=$holdout bytes=$bytes"
          test "$logs" = "25" && test "$holdout" = "7" && test "$bytes" = "971544"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extension dependencies
        # test_extension_typecheck registers only when extension/node_modules exists
        # (tests/gate/CMakeLists.txt), so WITHOUT this the gate CI runs is a different set
        # from the one the manifest pins -- 25 selected against 26 recorded -- and the TS
        # half of a protocol change goes unchecked. That check exists precisely so "a
        # protocol change that breaks the TS side must fail here, not in someone's editor
        # three days later", and it had never once run on CI.
        run: npm ci --prefix extension

      - name: Extension compile
        # test_view_script_parses registers only when extension/out/webview.js exists
        # (tests/gate/CMakeLists.txt). npm ci alone leaves that file absent, so CMake
        # skips the check and the pinned 51-test gate becomes 50 -- which is exactly the
        # silent-narrowing the manifest exists to catch. Compile before Configure so the
        # EXISTS probe sees the artifact.
        run: npm run compile --prefix extension

      - name: Configure
        # -DLMP_WITH_MLX=OFF is not a downgrade of what CI checks: it is what CI has
        # ALWAYS done. The old venv probe could not find an interpreter with mlx on a
        # runner, so MLX_FOUND was false here and MlxBackend compiled as a typed refusal.
        # Now that MLX is built from source rather than discovered, leaving it on would
        # compile every Metal kernel at -j3 and blow the 20-minute budget. The gate is
        # model-free by design (S11.6), so nothing below depends on it.
        run: cmake --preset dev -DLMP_WITH_MLX=OFF

      - name: Build
        run: cmake --build --preset dev -j3

      - name: Gate
        run: ctest --preset gate

      - name: Scoreboards still compile
        # A benchmark that stopped building six weeks ago is a benchmark already lost.
        run: cmake --build --preset dev --target blast_radius_score_e12 log_triage_score_incumbent

  sanitizers:
    # S15.8: ASan/UBSan on the gate suite.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Same reason as the gate job: without node_modules the pinned manifest and the
      # selected set disagree, and test_gate_manifest fails by design.
      - run: npm ci --prefix extension
      # Same reason as the gate job: without out/webview.js, test_view_script_parses is
      # skipped at Configure and the pinned count no longer matches.
      - run: npm run compile --prefix extension

      # The asan preset never had MLX either (same probe, same absent interpreter), and
      # LMP_WITH_MLX defaults OFF, so this stays as it was.
      - run: cmake --preset asan
      - run: cmake --build --preset asan -j3
      - run: ctest --preset gate-asan
